name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Run Ruff
        uses: astral-sh/ruff-action@v4.1.0
        with:
          version-file: pyproject.toml
          src: "."
          args: check

  k8s:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Validate Kubernetes manifests
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/kubeconform.tgz \
            https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          tar -xzf /tmp/kubeconform.tgz -C /tmp kubeconform
          kubectl kustomize deploy/k8s/base \
            | /tmp/kubeconform -strict -ignore-missing-schemas
          kubectl kustomize deploy/k8s/logging \
            | /tmp/kubeconform -strict -ignore-missing-schemas
          kubectl kustomize deploy/k8s/overlays/desktop \
            | /tmp/kubeconform -strict -ignore-missing-schemas

  test:
    needs: [lint, k8s]
    runs-on: ubuntu-latest
    env:
      REQUIRED_USER_TELEGRAM_ID: ${{ secrets.REQUIRED_USER_TELEGRAM_ID || '123456789' }}
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        id: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: 2.1.1
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Load cached venv
        id: cached-poetry-dependencies
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-test-${{ runner.os }}-${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('poetry.lock') }}

      - name: Install dependencies
        if: steps.cached-poetry-dependencies.outputs.cache-hit != 'true'
        run: poetry install --no-interaction --no-ansi --no-root

      - name: Run tests
        run: poetry run pytest tests/ -q
