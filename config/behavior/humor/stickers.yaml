# Sticker engagement config.
#
# The bot plays personality by sending stickers from the pack:
#   https://t.me/addstickers/VanessaBot
#
# The LLM may suggest a tag by appending `[sticker:<tag>]` to the end of a reply;
# the bot ALSO applies the anti-spam gates below before actually sending anything:
#   - probability: send only with this chance even when a sticker fits;
#   - tag_probability: per-tag overrides of `probability` (love/delight send more
#     often, дежурные thinking/irritation less, so they don't get stale);
#   - min_messages_between: never more often than once per N bot replies (per chat).
#
# `file_id` is set directly from the live pack (getStickerSet), so the bot does not
# need a network fetch at startup. `index` is the 0-based position in the pack and
# is only used as a fallback if `file_id` is missing. Refresh the list with:
#   python scripts/export_sticker_pack.py --update
#
# `description` on each sticker is shown to the LLM (inside the generated
# <sticker_system> XML block) so it knows when to use the emotion, not just the
# bare tag + emoji. `tag_aliases` is a soft fallback: if the model writes a tag
# the pack doesn't have, the parser maps it to the closest real one or drops it.

enabled: true
sticker_set_name: "VanessaBot"

# Chance to send a sticker when the LLM tagged the reply as a good fit.
probability: 0.6
# Chance for heuristics-only matches (no LLM tag).
heuristic_probability: 0.45
# Hard cap: at most one sticker per this many bot replies in a chat.
min_messages_between: 3

# Per-tag overrides of `probability` (LLM-tagged replies). Warm/positive tags
# send more often; «дежурные» tags less so they don't get stale.
tag_probability:
  love: 0.8
  delight: 0.75
  greeting: 0.6
  farewell: 0.6
  irritation: 0.5
  thinking: 0.4
  embarrassment: 0.6
  bemused: 0.5
  tease: 0.6
  weary: 0.4

# Soft fallback for tags the model invents but the pack doesn't have: mapped to
# the closest real tag in the parser, or dropped if there's no alias. Unknown
# tags that get mapped/dropped are logged and counted (sticker_unknown_tags_total).
tag_aliases:
  angry: irritation
  upset: irritation
  annoyed: irritation
  facepalm: irritation
  happy: delight
  lol: delight
  laugh: delight
  haha: delight
  hooray: delight
  bye: farewell
  bye_bye: farewell
  hi: greeting
  hello: greeting
  hey: greeting
  thanks: love
  thx: love
  thank_you: love
  sorry: embarrassment
  confused: bemused
  shrug: thinking
  unsure: thinking
  hmm: thinking
  smirk: tease
  flirty: tease
  tired: weary
  bored: weary

# The sticker-system cheat-sheet rendered as XML into the LLM prompt
# (<sticker_system> block). Tags and their usage notes come from the sticker
# entries below — this text is only the intro and the rules.
system_description: |
  У тебя есть набор эмоциональных стикеров. Ты можешь предложить отправить
  подходящий стикер, добавив его тег в самом конце своего ответа в формате
  [sticker:tag]. Используй теги уместно, подстраиваясь под тон сообщения.
  Не ставь тег в каждом сообщении.

tag_rules:
  - "Вставляй не более одного тега на сообщение."
  - "Тег всегда пишется строго в самом конце ответа."
  - "Если момент нейтральный, серьёзный или рабочий — вообще не добавляй теги."

# Tags whose sticker fully replaces the text reply: the bot sends ONLY the
# sticker (the image already carries the message — bemused 😐 has a caption on
# it). The anti-spam gate is bypassed for these: the sticker IS the reply.
sticker_only_tags: [bemused]

