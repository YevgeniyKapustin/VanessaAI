    - ванесса
  trigger_keywords:
    - помоги
    - объясни
    - найди
    - расскажи
  question_words:
    - кто
    - что
    - где
    - когда
    - почему
    - как
    - зачем
    - какой
    - какая
    - какие
    - сколько
  modal_verbs:
    - можно
    - нужно
