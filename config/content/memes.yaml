# Curated meme catalog the bot may reference in dialogue.
#
# Gating (mirrors the sticker gate):
#   - enabled: master switch.
#   - probability: chance to actually offer a meme when it matches (anti-spam).
#   - min_messages_between: per-chat cooldown in bot replies.
#   - max_per_reply: how many memes may be offered in one turn.
#
# A meme is offered ONLY when:
#   1. the turn planner says humor is appropriate (humor_ok), AND
#   2. one of its keywords matches the user's message (whole-word match), AND
#   3. the anti-spam gate allows it.
#
# The LLM sees `name`, `meaning` and `usage` and is told to paraphrase, never
# dump the definition, use at most one meme per reply, and never force it.

enabled: true
probability: 0.4
min_messages_between: 8
max_per_reply: 1
# Proactive mode: when humor_ok and no keyword matched, offer a compact menu
# (up to `offer_max` memes) so Vanessa can pick one herself.
offer_on_humor: true
offer_max: 6

memes:
  - name: "Окак"
    keywords: ["окак", "окаешь", "окает", "окаю", "окаем"]
    meaning: "реакция удивления, недоумения или сарказма на абсурдную/нелепую ситуацию; образ — кот в чёрном капюшоне с подписью «Окак»"
    usage: "когда кто-то говорит или делает абсурдное, и хочется показать недоумение"
    example: "Окак, то есть ты реально не сохранил файл?"

  - name: "Смерть в нищете"
    keywords: ["смерть в нищете", "нищета", "страх бедности"]
    meaning: "мем из TikTok: человеку якобы звонит контакт «Смерть в нищете» после «страха бедности» на фоне кризисных ситуаций"
    usage: "когда речь про деньги, бедность, кризис — пошутить про «страх бедности»"
    example: "Всё, после таких трат мне уже звонит «Смерть в нищете»"

  - name: "Договорнячок"
    keywords: ["договорнячок", "договорняк"]
    meaning: "слово, высмеивающее ожидания переговоров/сделки; позже — абсурдное слово вне контекста"
    usage: "когда кто-то ждёт диалога, сделки или «договориться», либо для абсурдного комментария"
    example: "Ну да, ща будет договорнячок, все такие серьёзные"

  - name: "А ниче тот факт, что...?"
    keywords: ["а ниче", "а ничего", "а ниче тот факт", "тот факт что"]
    meaning: "риторический вопрос-контраргумент «а ничего, что...?» — указывает на очевидное противоречие"
    usage: "когда хочется ткнуть собеседника в очевидное противоречие его слов"
    example: "А ниче тот факт, что ты вчера сам это говорил?"

  - name: "Умный человек в очках (Топлес)"
    keywords: ["умный человек в очках", "топлес"]
    meaning: "мем про блогера Яна Топлеса: фото похоже на шаблонные обои рабочего стола"
    usage: "когда что-то выглядит как дефолтные обои/шаблон, или речь про Топлеса"
    example: "Это не фото, это же стандартные обои рабочего стола"

  - name: "6–7 (сикс-севен)"
    keywords: ["6-7", "сикс-севен", "сикс севен", "шесть семь"]
    meaning: "бессмысленное высказывание, которое повторяют с жестом (ладони вверх-вниз)"
    usage: "когда кто-то несёт бессмыслицу или для абсурдной вставки"
    example: "Шесть-семь, короче, как тебе такое?"

  - name: "Можно. А зачем?"
    keywords: ["можно. а зачем", "можно а зачем", "а зачем"]
    meaning: "универсальный ответ на бессмысленные предложения: можно, но зачем"
    usage: "когда предлагают что-то бессмысленное или лишнее"
    example: "Можно. А зачем?"

  - name: "Бурмалда"
    keywords: ["бурмалда"]
    meaning: "универсальное слово для описания любой нелепицы или странной ситуации"
    usage: "когда происходит что-то странное/нелепое и хочется назвать это одним словом"
    example: "Ну и бурмалда тут у вас"

  - name: "Воздухан"
    keywords: ["воздухан"]
    meaning: "мем о хвастунах, которые дают пустые обещания и не подкрепляют слова делом (образ — человек с вентилятором вместо головы)"
    usage: "когда кто-то хвастается или обещает, но ничего не делает"
    example: "Опять воздухан, ясно, ждём-с"

  - name: "Черемша (советская эстетика)"
    keywords: ["черемша", "советская эстетика"]
    meaning: "псевдоностальгические ИИ-ролики о вымышленной советской реальности; главный герой — Черемша (тело зайца, голова льва) со сверхспособностями"
    usage: "когда речь про ностальгию, советскую эстетику, ИИ-ролики или вымышленные истории"
    example: "О, советская эстетика, ща Черемша выйдет и всё решит"

  - name: "Альтушка"
    keywords: ["альтушка", "альтушки", "альт"]
    meaning: "девушка с неформальной внешностью (яркие волосы, оверсайз-одежда), которая пытается быть «не как все»"
    usage: "когда речь про неформальный стиль, яркий образ, «не как все»"
    example: "Типичная альтушка — оверсайз и недовольное лицо"

  - name: "Скуф"
    keywords: ["скуф", "скуфы"]
    meaning: "мужчина старше 30–35 лет, склонный к полноте, с пивным животом и залысинами; пассивный отдых, «раньше было лучше»"
    usage: "когда речь про возраст, образ жизни, World of Tanks и пиво, «раньше было лучше»"
    example: "Классический скуф: пиво, телевизор и «раньше было лучше»"

  - name: "Скуф и Альтушка (Госуслуги)"
    keywords: ["скуф и альтушка", "альтушку на госуслугах", "госуслуг"]
    meaning: "лидер года; породил концепцию «получения альтушки на Госуслугах», вышедшую далеко за пределы интернет-шуток"
    usage: "когда речь про отношения, стереотипные пары «скуф + альтушка»"
    example: "Скуфу осталось только альтушку на Госуслугах заказать"

  - name: "Масик, Тюбик, Чечик, Штрих"
    keywords: ["масик", "тюбик", "чечик", "штрих"]
    meaning: "классификация мужчин в повседневной речи: от заботливого «масика» до проблемного «тюбика»"
    usage: "когда речь про типы мужчин, отношения, стереотипные образы"
    example: "Это не масик, это тюбик, беги от него"

  - name: "Кот Чипи Чипи Чапа Чапа"
    keywords: ["чипи чипи чапа чапа", "дубидубиду", "дуби дуби"]
    meaning: "маленький котёнок, прыгающий под песню «Dubidubidu» — главный международный хит"
    usage: "когда речь про милоту, песни, котиков, что-то умилительное"
    example: "Чипи чипи чапа чапа, и все дела"

  - name: "А я-то думал, это сова"
    keywords: ["а я-то думал", "думал это сова", "это сова"]
    meaning: "аудиомем из старого репортажа: реальность не совпала с ожиданиями"
    usage: "когда реальность не совпала с ожиданиями"
    example: "А я-то думал, это сова, а это совсем другое"

  - name: "Бархатные тяги"
    keywords: ["бархатные тяги", "кефтеме"]
    meaning: "аудиомем из WhatsApp («что за бархатные тяги такие, уф, кефтеме!») про странную или роскошную обувь"
    usage: "когда речь про странную/роскошную обувь или удивление от вещи"
    example: "Что за бархатные тяги такие, кефтеме"

  - name: "Думаешь, я тебя не уничтожу?"
    keywords: ["не уничтожу", "понасенков"]
    meaning: "цитата историка Евгения Понасенкова — высшая степень угрозы в шутливых спорах"
    usage: "в шутливых спорах, когда хочется показать «серьёзность» угрозы с иронией"
    example: "Думаешь, я тебя не уничтожу? Шучу, конечно"

  - name: "Гигачад (Gigachad)"
    keywords: ["гигачад", "gigachad"]
    meaning: "культовый мем — чёрно-белый образ «идеального мужчины» с гипертрофированными чертами, волевым подбородком и прессом"
    usage: "когда надо показать превосходство, «идеального» мужчину или абсурдный идеал"
    example: "Гигачад бы так не поступил"

  - name: "Соевый Вояк vs Гигачад"
    keywords: ["соевый вояк", "соевый куколд", "вояк"]
    meaning: "шаблон-сравнение: слева плачет/злится глупый персонаж («соевый вояк»), справа спокойно улыбается Гигачад — превосходство позиции"
    usage: "когда хочется показать превосходство одной (часто абсурдной) позиции над другой"
    example: "Ты сейчас как соевый вояк, а я как гигачад"

  - name: "Мюсли"
    keywords: ["мюсли"]
    meaning: "ироничный термин Рунета для банальных, пафосных или псевдоинтеллектуальных цитат «за жизнь»"
    usage: "когда кто-то выдаёт банальную/пафосную «мудрость» или псевдоинтеллектуальную цитату"
    example: "Классические мюсли, как с обёртки от конфет"
