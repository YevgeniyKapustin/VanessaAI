    tags: [love]
    weight: 1.0
    index: 0
    emoji: "❤️"
    file_id: "CAACAgIAAxUAAWqOt_GAnIXjY0ZifpUnPDzG4pFGAAL7pQACWyBwSJSpNLR0IJwXPQQ"
