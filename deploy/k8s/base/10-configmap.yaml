# Example ConfigMap — NOT applied by kustomize.
# Live values: poetry run python scripts/k8s_secrets.py apply
# kubectl apply -k must not ship this file or it will clobber the CLI output.
apiVersion: v1
kind: ConfigMap
metadata:
  name: vanessa-config
  namespace: vanessa
data:
  BROKER_STREAMS_PREFIX: "vanessa"
  BROKER_GROUP_AGENT: "agent"
  BROKER_GROUP_WORKER: "worker"
  BROKER_RPC_TIMEOUT_SECONDS: "120"
  BROKER_POLL_SECONDS: "0.05"
  BROKER_DLQ_ENABLED: "true"
  BROKER_STREAM_MAXLEN: "100000"
  WORKER_ENABLED: "true"
  WORKER_METRICS_PORT: "9102"
  BOT_METRICS_PORT: "9101"
  POSTGRES_HOST: "postgres"
  POSTGRES_PORT: "5432"
  POSTGRES_USER: "vanessa"
  POSTGRES_DB: "vanessa"
  QDRANT_HOST: "qdrant"
  QDRANT_PORT: "6333"
  QDRANT_COLLECTION: "messages"
  QDRANT_KNOWLEDGE_COLLECTION: "knowledge"
  KNOWLEDGE_STORE: "postgres"
  MCP_WEBSEARCH_URL: "http://mcp-websearch:8101/mcp"
  MCP_KNOWLEDGE_URL: "http://mcp-knowledge:8102/mcp"
  MCP_VISION_URL: "http://mcp-vision:8103/mcp"
  MCP_TIMEOUT_SECONDS: "10"
  MCP_RETRIES: "2"
  MCP_FAIL_OPEN: "false"
  CONTENT_CONFIG_PATH: "config/content"
  NICKNAMES_CONFIG_PATH: "config/nicknames.yaml"
  LOG_LEVEL: "INFO"
  LOG_JSON: "true"
  LOG_FILE_ENABLED: "false"
  METRICS_ENABLED: "true"
  METRICS_REQUIRE_TOKEN: "false"
