# Representative ConfigMap for the shared non-secret settings.
# The full key set mirrors app/config/settings_sections.py (env-driven).
# Placeholders must be adjusted for the target cluster.
apiVersion: v1
kind: ConfigMap
metadata:
  name: vanessa-config
  namespace: vanessa
data:
  # Transport / broker
  TRANSPORT: "redis"
  BROKER_STREAMS_PREFIX: "vanessa"
  BROKER_GROUP_AGENT_CORE: "agent-core"
  BROKER_GROUP_WORKER: "worker"
  BROKER_RPC_TIMEOUT_SECONDS: "120"
  BROKER_POLL_SECONDS: "0.05"
  BROKER_DLQ_ENABLED: "true"
  BROKER_STREAM_MAXLEN: "100000"
  # Worker
  WORKER_ENABLED: "true"
  WORKER_METRICS_PORT: "9102"
  # Postgres / Qdrant (hosts/ports/names — credentials live in the Secret)
  POSTGRES_HOST: "postgres"
  POSTGRES_PORT: "5432"
  POSTGRES_USER: "vanessa"
  POSTGRES_DB: "vanessa"
  QDRANT_HOST: "qdrant"
  QDRANT_PORT: "6333"
  QDRANT_COLLECTION: "messages"
  QDRANT_KNOWLEDGE_COLLECTION: "knowledge"
  # MCP server endpoints
  MCP_WEBSEARCH_URL: "http://mcp-websearch:8101/mcp"
  MCP_KNOWLEDGE_URL: "http://mcp-knowledge:8102/mcp"
  MCP_VISION_URL: "http://mcp-vision:8103/mcp"
  MCP_OBSIDIAN_URL: "http://mcp-obsidian:8104/mcp"
  MCP_TIMEOUT_SECONDS: "10"
  MCP_RETRIES: "2"
  MCP_FAIL_OPEN: "true"
  # Content / logging / metrics
  CONTENT_CONFIG_PATH: "config/content"
  NICKNAMES_CONFIG_PATH: "config/nicknames.yaml"
  LOG_LEVEL: "INFO"
  METRICS_ENABLED: "true"
