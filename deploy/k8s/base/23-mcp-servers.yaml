# MCP servers: isolated tool services. Only agent may call them
# (see 30-networkpolicy.yaml) except metrics scrape from monitoring.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-websearch
  namespace: vanessa
  labels: { app: vanessa, component: mcp-websearch }
spec:
  replicas: 1
  strategy:
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels: { app: vanessa, component: mcp-websearch }
  template:
    metadata:
      labels: { app: vanessa, component: mcp-websearch }
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: server
          image: vanessa-agent:local
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "services.mcp.runner", "websearch", "--port", "8101"]
          ports: [{ containerPort: 8101, name: mcp }]
          envFrom:
            - configMapRef: { name: vanessa-config }
          env:
            - name: MCP_WEBSEARCH_URL
              value: ""
            - name: WEB_SEARCH_API_KEY
              valueFrom:
                secretKeyRef:
                  name: vanessa-secrets
                  key: WEB_SEARCH_API_KEY
                  optional: true
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
            readOnlyRootFilesystem: true
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
          resources:
            requests: { cpu: "50m", memory: "128Mi" }
            limits: { cpu: "500m", memory: "512Mi" }
          readinessProbe:
            httpGet: { path: /health, port: mcp }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: mcp }
            initialDelaySeconds: 20
            periodSeconds: 20
      volumes:
        - { name: tmp, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-websearch
  namespace: vanessa
spec:
  selector: { app: vanessa, component: mcp-websearch }
  ports: [{ port: 8101, targetPort: mcp, name: mcp }]
---
