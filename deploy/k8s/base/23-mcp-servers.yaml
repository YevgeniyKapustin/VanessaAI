# MCP servers: isolated tool services, each with its own resources.
# Only the agent-core may call them (see 30-networkpolicy.yaml).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-websearch
  namespace: vanessa
  labels: { app: vanessa, component: mcp-websearch }
spec:
  replicas: 1
  selector:
    matchLabels: { app: vanessa, component: mcp-websearch }
  template:
    metadata:
      labels: { app: vanessa, component: mcp-websearch }
    spec:
      containers:
        - name: server
          image: vanessa-app:local
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "services.mcp.runner", "websearch", "--port", "8101"]
          ports: [{ containerPort: 8101, name: mcp }]
          envFrom:
            - configMapRef: { name: vanessa-config }
            - secretRef: { name: vanessa-secrets }
          env:
            - name: MCP_WEBSEARCH_URL
              value: ""
          resources:
            requests: { cpu: "50m", memory: "128Mi" }
            limits: { cpu: "500m", memory: "512Mi" }
          readinessProbe:
            httpGet: { path: /health, port: mcp }
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-websearch
  namespace: vanessa
spec:
  selector: { app: vanessa, component: mcp-websearch }
  ports: [{ port: 8101, targetPort: mcp, name: mcp }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-knowledge
  namespace: vanessa
  labels: { app: vanessa, component: mcp-knowledge }
spec:
  replicas: 1
  selector:
    matchLabels: { app: vanessa, component: mcp-knowledge }
  template:
    metadata:
      labels: { app: vanessa, component: mcp-knowledge }
    spec:
      containers:
        - name: server
          image: vanessa-app:local
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "services.mcp.runner", "knowledge", "--port", "8102"]
          ports: [{ containerPort: 8102, name: mcp }]
          envFrom:
            - configMapRef: { name: vanessa-config }
            - secretRef: { name: vanessa-secrets }
          resources:
            requests: { cpu: "100m", memory: "256Mi" }
            limits: { cpu: "1", memory: "1Gi" }
          readinessProbe:
            httpGet: { path: /health, port: mcp }
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - { name: knowledge, mountPath: /app/knowledge, readOnly: true }
      volumes:
        - name: knowledge
          persistentVolumeClaim: { claimName: vanessa-knowledge }
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-knowledge
  namespace: vanessa
spec:
  selector: { app: vanessa, component: mcp-knowledge }
  ports: [{ port: 8102, targetPort: mcp, name: mcp }]
---
