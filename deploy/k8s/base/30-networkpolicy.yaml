# Default-deny ingress + explicit allow rules. Backing stores
# (redis / postgres / qdrant) must carry the component labels referenced here.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: vanessa
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
# Broker (Redis): bot / agent-core / worker may publish & consume.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-to-redis
  namespace: vanessa
spec:
  podSelector:
    matchLabels: { component: redis }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: { matchLabels: { app: vanessa } }
      ports: [{ port: 6379 }]
---
# Postgres: agent-core, worker, and mcp-knowledge (vault reads).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-to-postgres
  namespace: vanessa
spec:
  podSelector:
    matchLabels: { component: postgres }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - {
                  key: component,
                  operator: In,
                  values: [agent-core, worker, mcp-knowledge],
                }
      ports: [{ port: 5432 }]
---
# Qdrant: only agent-core and worker.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-to-qdrant
  namespace: vanessa
spec:
  podSelector:
    matchLabels: { component: qdrant }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - { key: component, operator: In, values: [agent-core, worker] }
      ports:
        - { port: 6333 }
        - { port: 6334 }
---
# MCP servers: ONLY agent-core may call them (no cross-MCP, no bot).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-agent-core-to-mcp
  namespace: vanessa
spec:
  podSelector:
    matchExpressions:
      - { key: component, operator: In, values: [mcp-websearch, mcp-knowledge, mcp-vision] }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: { matchLabels: { app: vanessa, component: agent-core } }
      ports: [{ port: 8101 }, { port: 8102 }, { port: 8103 }]
---
# agent-core HTTP: bot (legacy HTTP fallback) + in-cluster Prometheus.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-to-agent-core-http
  namespace: vanessa
spec:
  podSelector:
    matchLabels: { app: vanessa, component: agent-core }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: { matchLabels: { app: vanessa, component: bot } }
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: monitoring } }
      ports: [{ port: 8000 }]
---
# Prometheus in namespace monitoring. Hybrid Compose Prometheus is outside
# the cluster — leave these policies unapplied on Docker Desktop.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-metrics-scrape
  namespace: vanessa
spec:
  podSelector:
    matchExpressions:
      - {
          key: component,
          operator: In,
          values: [bot, worker, mcp-websearch, mcp-knowledge, mcp-vision],
        }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: monitoring } }
      ports:
        - { port: 9101 }
        - { port: 9102 }
        - { port: 8101 }
        - { port: 8102 }
        - { port: 8103 }
