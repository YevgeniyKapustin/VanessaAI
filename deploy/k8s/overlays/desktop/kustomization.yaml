apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
patches:
  - path: namespace-pss.yaml
  - path: configmap-hosts.yaml
  - path: bot-replicas.yaml
  - path: delete-pvc-knowledge.yaml
  - target:
      kind: Deployment
      name: agent-core
    path: agent-core-volumes.yaml
  - target:
      kind: Deployment
      name: worker
    path: worker-volumes.yaml
  - target:
      kind: Deployment
      name: bot
    path: bot-volumes.yaml
  - target:
      kind: Deployment
      name: mcp-knowledge
    path: mcp-knowledge-volumes.yaml
