# Docker Desktop only. hostPort binds every host interface, not 127.0.0.1.
# Do not copy this patch onto a real node. Prefer kubectl port-forward.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: loki
  namespace: logging
spec:
  template:
    spec:
      containers:
        - name: loki
          ports:
            - containerPort: 3100
              hostPort: 3100
              name: http
