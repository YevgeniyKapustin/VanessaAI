# stub_status for nginx-prometheus-exporter. Not published to the host.
# Allow Docker/private nets only; deny the public listen on :80.

server {
    listen 8080;
    server_name localhost;

    allow 127.0.0.1;
    allow 10.0.0.0/8;
    allow 172.16.0.0/12;
    allow 192.168.0.0/16;
    deny all;

    location /stub_status {
        stub_status;
        access_log off;
    }
}
