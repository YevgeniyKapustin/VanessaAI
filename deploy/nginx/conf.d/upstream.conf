# Active API upstream — the zero-downtime deploy script swaps the server here
# between the blue/green containers (api-blue:8000 / api-green:8000) and then
# runs `nginx -s reload`, which re-reads this file without dropping active
# keepalive connections.
#
# Default target: the compose service name `api` (resolves to all running
# replicas via Docker's embedded DNS — round-robin load balancing).
#
# Deploy script: scripts/zero_downtime_deploy.sh

upstream vanessa_api {
    server api:8000 max_fails=3 fail_timeout=30s;
    keepalive 32;
}
