# Compose-only: Nginx upstream for the `api` service (Docker DNS).
# Production traffic is Kubernetes, not this file.
#
# Hostname `api` is resolved at nginx start/reload. http{} has
# resolver 127.0.0.11 (Docker). After recreating the API container, run
# `nginx -s reload` so the upstream IP is refreshed.

upstream vanessa_api {
    server api:8000 max_fails=3 fail_timeout=30s;
    keepalive 32;
}
