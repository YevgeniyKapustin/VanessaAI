# Vanessa API virtual host — single entry point behind the load balancer.
#
# Only /health/ready traffic is proxied to upstreams that pass the readiness
# check. When a replica is being swapped during a rolling update, Nginx
# (via max_fails/fail_timeout) keeps routing to the healthy replica.

server {
    listen 80;
    server_name _;

    # ---- Health checks ----------------------------------------------------
    # Liveness: cheap, no upstream round-trip.
    location = /health {
        return 200 '{"status":"ok"}';
        add_header Content-Type application/json;
    }
    location = /health/live {
        return 200 '{"status":"ok"}';
        add_header Content-Type application/json;
    }
    # Readiness: pass to the app so it can verify DB/Qdrant connectivity.
    location = /health/ready {
        proxy_pass http://vanessa_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # ---- API ---------------------------------------------------------------
    location / {
        proxy_pass http://vanessa_api;
        proxy_http_version 1.1;
        # Required for keepalive to the upstream (Connection must be unset).
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        # Drop the connection to a backend that fails 3 times in 30s; Nginx
        # retries the request on the remaining replica (idempotent GETs only).
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 3;
    }
}
