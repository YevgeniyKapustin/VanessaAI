# Nginx reverse proxy / load balancer for the Vanessa API.
#
# Used together with docker-compose.prod.yml. Terminates external HTTP,
# load-balances across the API replicas on the Docker network, and performs a
# zero-downtime reload with `docker exec nginx nginx -s reload` (no dropped
# keepalive connections).
#
# Run:  docker compose -f docker-compose.prod.yml up -d

user nginx;
worker_processes auto;
error_log /dev/stderr warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    # Let each worker accept as many connections as possible (keepalive).
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'upstream=$upstream_addr rt=$request_time '
                    'ups_resp=$upstream_response_time';
    access_log /dev/stdout main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    server_tokens off;

    # File uploads / larger JSON. Default 1m returns 413.
    client_max_body_size 10m;

    # JWT / large Cookie / Authorization. Default 1k / 4x8k → 400/414.
    client_header_buffer_size 16k;
    large_client_header_buffers 4 32k;
    proxy_buffer_size 16k;
    proxy_buffers 8 16k;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types application/json application/javascript text/plain
               text/css application/xml application/xml+rss;

    # Per-IP flood / brute-force. Health locations are not in these zones.
    limit_req_zone $binary_remote_addr zone=api_req:10m rate=30r/s;
    limit_conn_zone $binary_remote_addr zone=api_conn:10m;
    limit_req_status 429;
    limit_conn_status 429;

    include /etc/nginx/snippets/real_ip.conf;

    # Docker embedded DNS. Re-resolve service names after container restarts
    # (static `server name:port` in upstream is still resolved on reload).
    resolver 127.0.0.11 valid=10s ipv6=off;

    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    # Upstream definition lives in conf.d/upstream.conf so the zero-downtime
    # deploy script can swap the active backend (api-blue / api-green) and
    # reload without dropping active keepalive connections.
    include /etc/nginx/conf.d/*.conf;
}
