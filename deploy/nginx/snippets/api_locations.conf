# Shared locations for HTTP and (optional) HTTPS server blocks.
# Included from conf.d/vanessa.conf and ssl.conf.example.

# Liveness: cheap, no upstream round-trip. No rate limits (probes).
location = /health {
    return 200 '{"status":"ok"}';
    add_header Content-Type application/json;
}
location = /health/live {
    return 200 '{"status":"ok"}';
    add_header Content-Type application/json;
}

# Readiness: pass to the app so it can verify DB/Qdrant connectivity.
location = /health/ready {
    proxy_pass http://vanessa_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_connect_timeout 5s;
    proxy_send_timeout 10s;
    proxy_read_timeout 10s;
}

location / {
    limit_req zone=api_req burst=40 nodelay;
    limit_conn api_conn 32;

    proxy_pass http://vanessa_api;
    proxy_http_version 1.1;
    # Required for keepalive to the upstream (Connection must be unset).
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Fail fast on connect; allow longer LLM/RAG responses than http default.
    proxy_connect_timeout 5s;
    proxy_send_timeout 120s;
    proxy_read_timeout 120s;
    # Drop the connection to a backend that fails 3 times in 30s; Nginx
    # retries the request on the remaining replica (idempotent GETs only).
    proxy_next_upstream error timeout http_502 http_503 http_504;
    proxy_next_upstream_tries 3;
}
