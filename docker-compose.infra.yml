# Hybrid K8s: interpolate REDIS_AUTH / POSTGRES_* from the app overlay:
#   docker compose --env-file .env.defaults --env-file .env.local \
#     -f docker-compose.infra.yml up -d
# Bare `up -d` uses the default password and will not match .env.local.
services:
  postgres:
    image: postgres:16-alpine
    command:
      - postgres
      - -c
      - shared_buffers=64MB
      - -c
      - effective_cache_size=128MB
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=32MB
      - -c
      - max_connections=200
      - -c
      - idle_session_timeout=60000
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vanessa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vanessa}
      POSTGRES_DB: ${POSTGRES_DB:-vanessa}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vanessa}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - backend

  # App broker / worker Redis. Langfuse uses langfuse-redis (separate process).
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: >-
      redis-server --requirepass ${REDIS_AUTH:-vanessa-redis-pass}
      --maxmemory-policy noeviction
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "-a",
          "${REDIS_AUTH:-vanessa-redis-pass}",
          "ping",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - backend

volumes:
  postgres_data:
  redis_data:

networks:
  backend:
  frontend:
