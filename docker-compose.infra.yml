services:
  postgres:
    image: postgres:16-alpine
    command:
      - postgres
      - -c
      - shared_buffers=64MB
      - -c
      - effective_cache_size=128MB
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=32MB
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vanessa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vanessa}
      POSTGRES_DB: ${POSTGRES_DB:-vanessa}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vanessa}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - backend

  qdrant:
    image: qdrant/qdrant:latest
    environment:
      QDRANT__STORAGE__OPTIMIZERS__MEMMAP_THRESHOLD: 20000
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:6333/readyz || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - backend

  # App broker / worker Redis. Langfuse uses langfuse-redis (separate process).
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: >-
      redis-server --requirepass ${REDIS_AUTH:-vanessa-redis-pass}
      --maxmemory-policy noeviction
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "-a",
          "${REDIS_AUTH:-vanessa-redis-pass}",
          "ping",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - backend

volumes:
  postgres_data:
  qdrant_data:
  redis_data:

networks:
  backend:
  frontend:
