services:
  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "kubernetes.docker.internal:host-gateway"
    volumes:
      - ${PROMETHEUS_CONFIG:-./prometheus/prometheus.yml}:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules.yml:/etc/prometheus/rules.yml:ro
      - prometheus_data:/prometheus
      - ${KUBECONFIG_HOST:-./prometheus/kubeconfig.unused}:/etc/prometheus/kubeconfig:ro
    ports:
      - "9090:9090"
    networks:
      - backend
      - frontend

  loki:
    image: grafana/loki:3.4.2
    restart: unless-stopped
    command: ["-config.file=/etc/loki/local-config.yaml"]
    volumes:
      - ./deploy/loki/loki-config.yaml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    ports:
      - "3100:3100"
    networks:
      - backend
      - frontend

  vector:
    image: timberio/vector:0.45.0-debian
    restart: unless-stopped
    depends_on:
      - loki
    volumes:
      - ./deploy/vector/vector.yaml:/etc/vector/vector.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - backend

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - prometheus
      - loki
    environment:
      GF_SERVER_HTTP_PORT: "3001"
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      # Compose Loki: http://loki:3100. Hybrid k8s: host.docker.internal
      # (cluster Loki hostPort / port-forward --address 0.0.0.0).
      LOKI_URL: ${LOKI_URL:-http://loki:3100}
    volumes:
      # Named volume first; bind-mount dashboards onto the provisioner path
      # so both JSON files land in /var/lib/grafana/dashboards.
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3001:3001"
    networks:
      - backend
      - frontend

volumes:
  prometheus_data:
  grafana_data:
  loki_data:

networks:
  backend:
  frontend:
