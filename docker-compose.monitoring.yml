# Prometheus + Grafana + Alertmanager.
# Loki/Vector: docker-compose.logging.yml (Compose) or deploy/k8s/logging
# (Kubernetes). Do not run both.
services:
  prometheus:
    image: prom/prometheus:v2.55.1
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "kubernetes.docker.internal:host-gateway"
    volumes:
      - ${PROMETHEUS_CONFIG:-./prometheus/prometheus.yml}:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules.yml:/etc/prometheus/rules.yml:ro
      - prometheus_data:/prometheus
      - ${KUBECONFIG_HOST:-./prometheus/kubeconfig.unused}:/etc/prometheus/kubeconfig:ro
    ports:
      - "127.0.0.1:9090:9090"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    networks:
      - backend
      - frontend
    depends_on:
      - alertmanager

  alertmanager:
    image: prom/alertmanager:v0.28.1
    restart: unless-stopped
    volumes:
      - ./prometheus/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - "127.0.0.1:9093:9093"
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
    networks:
      - backend
      - frontend

  grafana:
    image: grafana/grafana:11.6.3
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - prometheus
    environment:
      GF_SERVER_HTTP_PORT: "3001"
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      # Compose Loki: http://loki:3100
      # Hybrid k8s (desktop overlay hostPort): http://host.docker.internal:3100
      LOKI_URL: ${LOKI_URL:-http://loki:3100}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3001:3001"
    networks:
      - backend
      - frontend

volumes:
  prometheus_data:
  grafana_data:

networks:
  backend:
  frontend:
