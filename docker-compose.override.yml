# Local development bind-mounts. Auto-included via COMPOSE_FILE in .env.defaults.
# Do not pass this file in production (-f list without override).
services:
  migrate:
    volumes:
      - ./vanessa:/app/vanessa
      - ./services:/app/services
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini

  api:
    volumes:
      - ./vanessa:/app/vanessa
      - ./services:/app/services
      - ./config:/app/config
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini
      - ./knowledge:/app/knowledge
      - ./data/logs:/app/logs

  bot:
    volumes:
      - ./vanessa:/app/vanessa
      - ./services:/app/services
      - ./config:/app/config
      - ./data/logs:/app/logs

  worker:
    volumes:
      - ./vanessa:/app/vanessa
      - ./services:/app/services
      - ./config:/app/config
      - ./knowledge:/app/knowledge
      - ./data/logs:/app/logs

  mcp-knowledge:
    volumes:
      - ./knowledge:/app/knowledge
