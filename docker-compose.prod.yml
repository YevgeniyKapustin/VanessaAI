# Production override — zero-downtime deployment. Do not include
# docker-compose.override.yml (dev bind-mounts).
# Run: docker compose --env-file .env.defaults --env-file .env.production
#   -f docker-compose.yml -f docker-compose.infra.yml
#   -f docker-compose.langfuse.yml -f docker-compose.monitoring.yml
#   -f docker-compose.prod.yml up -d

x-prod-env-files: &prod-env-files
  - .env.defaults
  - .env.production

services:
  migrate:
    env_file: *prod-env-files
    volumes: !reset []
    restart: "no"

  api:
    env_file: *prod-env-files
    ports: !reset []
    command: >
      uvicorn app.api.main:app --host 0.0.0.0 --port 8000
      --workers ${API_WORKERS:-1}
      --timeout-graceful-shutdown ${API_GRACEFUL_TIMEOUT:-30}
    volumes: !override
      - ./knowledge:/app/knowledge
    restart: always
    stop_grace_period: 45s

  bot:
    env_file: *prod-env-files
    volumes: !override
      - ./knowledge:/app/knowledge
      - ${OBSIDIAN_VAULT_HOST_PATH:-./data/obsidian-vault}:/vault
      - ${OBSIDIAN_SSH_DIR:-./.ssh/obsidian}:/home/app/.ssh:ro
    restart: always
    stop_grace_period: 45s

  worker:
    env_file: *prod-env-files
    volumes: !override
      - ./knowledge:/app/knowledge
    restart: always
    stop_grace_period: 45s

  mcp-websearch:
    env_file: *prod-env-files
    volumes: !reset []
    restart: always

  mcp-knowledge:
    env_file: *prod-env-files
    volumes: !override
      - ./knowledge:/app/knowledge
    restart: always

  mcp-vision:
    env_file: *prod-env-files
    volumes: !reset []
    restart: always

  nginx:
    image: nginx:1.27-alpine
    restart: always
    depends_on:
      api:
        condition: service_healthy
    networks:
      - frontend
      - backend
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx/conf.d:/etc/nginx/conf.d:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    stop_grace_period: 10s

networks:
  backend:
  frontend:
