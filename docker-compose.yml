# Always pull infra (postgres, redis) so a bare `docker compose up`
# still works if COMPOSE_FILE is unset. Langfuse/monitoring stay optional.
include:
  - docker-compose.infra.yml

x-app-image: &app-image
  image: vanessa-agent:latest
  build:
    context: .

x-lite-image: &lite-image
  image: vanessa-lite:latest
  build:
    context: .

x-env-files: &env-files
  - .env.defaults
  - path: .env.local
    required: false
  - path: .env
    required: false

services:
  # One-shot schema migration (advisory lock). Agent/worker replicas must not
  # run upgrade in the serving process.
  migrate:
    <<: *app-image
    command: python -m vanessa.infrastructure.db.locked_upgrade
    restart: "no"
    env_file: *env-files
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend

  agent:
    <<: *app-image
    command: >
      python -m services.agent.main
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    env_file: *env-files
    restart: unless-stopped
    # Give in-flight requests time to finish after SIGTERM (see /health/ready).
    stop_grace_period: 45s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      # /health/ready returns 503 until Postgres is reachable, so the container
      # only turns "healthy" once it can actually serve traffic — the proxy
      # (Nginx) waits for this before sending new requests here.
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
      # The lifespan cold start (vault sync + first sweep) can take a while,
      # so a short grace would mark the container "unhealthy" and abort
      # `docker compose up` (bot depends on agent).
      start_period: 300s
    # Hermes on the owner's PC arrives as a reverse SSH tunnel on the host
    # (docs/hermes.md); the agent only calls its /health.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - backend
      - frontend

  bot:
    <<: *lite-image
    command: python -m services.bot.main
    restart: unless-stopped
    # aiogram stops polling on SIGTERM and lets in-flight updates drain.
    stop_grace_period: 45s
    env_file: *env-files
    depends_on:
      agent:
        condition: service_healthy
    networks:
      - backend

  # --- Background worker -----------------------------------------------------
  # Consumes TaskMessage jobs from the broker (sweep, portraits, memory
  # extract, photo captions) in an isolated process/container so background
  # work never stalls the reply path. Turns and inbox notes go bot →
  # Redis → agent/worker.
  worker:
    <<: *app-image
    command: python -m services.worker.main
    restart: unless-stopped
    stop_grace_period: 45s
    env_file: *env-files
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # Hermes runs (docs/hermes.md) go through the host's reverse SSH tunnel.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - backend
    # Isolate the background work from the reply path.
    deploy:
      resources:
        limits:
          # Docker refuses a limit above the host CPU count (1-vCPU droplet).
          cpus: "${WORKER_CPUS:-2.0}"
          memory: 2G

  # --- MCP servers (external tools over SSE) ---------------------------------
  # Each is an isolated process/container exposing its own /health, /metrics
  # and /mcp endpoint; the agent calls them over the wire (never imports).
  mcp-websearch:
    <<: *lite-image
    command: python -m services.mcp.runner websearch --port 8101
    restart: unless-stopped
    env_file: *env-files
    environment:
      MCP_WEBSEARCH_URL: ""
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8101/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  mcp-knowledge:
    <<: *lite-image
    command: python -m services.mcp.runner knowledge --port 8102
    restart: unless-stopped
    env_file: *env-files
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8102/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  mcp-vision:
    <<: *lite-image
    command: python -m services.mcp.runner vision --port 8103
    restart: unless-stopped
    env_file: *env-files
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8103/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 1G

networks:
  backend:
  frontend:
