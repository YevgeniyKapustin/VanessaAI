# Always pull infra (postgres, qdrant, redis) so a bare `docker compose up`
# still works if COMPOSE_FILE is unset. Langfuse/monitoring stay optional.
include:
  - docker-compose.infra.yml

x-app-image: &app-image
  image: vanessa-agent:latest
  build:
    context: .
    args:
      PRELOAD_EMBEDDINGS: "1"

x-lite-image: &lite-image
  image: vanessa-lite:latest
  build:
    context: .
    args:
      PRELOAD_EMBEDDINGS: "0"

x-env-files: &env-files
  - .env.defaults
  - path: .env.local
    required: false
  - path: .env
    required: false

services:
  # One-shot schema migration (advisory lock). API/worker replicas must not
  # run upgrade in the serving process.
  migrate:
    <<: *app-image
    command: python -m vanessa.db.locked_upgrade
    restart: "no"
    env_file: *env-files
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend

  api:
    <<: *app-image
    command: >
      uvicorn services.agent_core.main:app --host 0.0.0.0 --port 8000
      --timeout-graceful-shutdown ${API_GRACEFUL_TIMEOUT:-30}
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    env_file: *env-files
    restart: unless-stopped
    # Give in-flight requests time to finish after SIGTERM (see /health/ready).
    stop_grace_period: 45s
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      # /health/ready returns 503 until Postgres is reachable, so the container
      # only turns "healthy" once it can actually serve traffic — the proxy
      # (Nginx) waits for this before sending new requests here.
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
      # The lifespan cold start (knowledge vector reindex + first sweep)
      # routinely takes 60-90s+, so a 30s grace would mark the container
      # "unhealthy" and abort `docker compose up` (bot depends on api healthy).
      start_period: 300s
    networks:
      - backend
      - frontend

  bot:
    <<: *lite-image
    command: python -m services.bot.main
    restart: unless-stopped
    # aiogram stops polling on SIGTERM and lets in-flight updates drain.
    stop_grace_period: 45s
    env_file: *env-files
    depends_on:
      api:
        condition: service_healthy
    networks:
      - backend

  # --- Background worker -----------------------------------------------------
  # Consumes TaskMessage jobs from the broker (message indexing, sweep,
  # portraits, knowledge reindex) in an isolated process/container so heavy
  # CPU/RAM work never stalls the reply path. Enabled by setting WORKER_ENABLED
  # (routing indexing through the broker) and pointing the bot at the broker
  # (TRANSPORT=redis). Safe to run even without those: the polling loops only
  # start in worker mode, and an empty task stream is a no-op.
  worker:
    <<: *app-image
    command: python -m services.worker.main
    restart: unless-stopped
    stop_grace_period: 45s
    env_file: *env-files
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - backend
    # Isolate the heavy CPU/RAM background work from the reply path.
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G

  # --- MCP servers (external tools over SSE) ---------------------------------
  # Each is an isolated process/container exposing its own /health, /metrics
  # and /mcp endpoint; the agent core calls them over the wire (never imports).
  mcp-websearch:
    <<: *lite-image
    command: python -m services.mcp.runner websearch --port 8101
    restart: unless-stopped
    env_file: *env-files
    environment:
      MCP_WEBSEARCH_URL: ""
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8101/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  mcp-knowledge:
    <<: *lite-image
    command: python -m services.mcp.runner knowledge --port 8102
    restart: unless-stopped
    env_file: *env-files
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8102/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  mcp-vision:
    <<: *lite-image
    command: python -m services.mcp.runner vision --port 8103
    restart: unless-stopped
    env_file: *env-files
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8103/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 1G

networks:
  backend:
  frontend:
