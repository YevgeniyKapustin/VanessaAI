global:
  resolve_timeout: 5m

route:
  receiver: default
  group_by: [alertname, stream]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 12h

receivers:
  - name: default
    # Alerts show in Prometheus / Alertmanager UI until you add a webhook:
