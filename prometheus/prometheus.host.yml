# Alternate scrape config when Vanessa processes bind on the Docker host
# and Prometheus runs in a container. Do not merge with prometheus.yml:
# dual targets in one job mark `up` as failed for the unused address.
# Mount this file instead of prometheus.yml, or copy the jobs you need.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules.yml

scrape_configs:
  - job_name: vanessa-api
    metrics_path: /metrics
    scrape_timeout: 10s
    static_configs:
      - targets: ["host.docker.internal:8000"]
        labels:
          environment: production

  - job_name: vanessa-bot
    metrics_path: /metrics
    scrape_timeout: 10s
    static_configs:
      - targets: ["host.docker.internal:9101"]
        labels:
          environment: production

  - job_name: vanessa-worker
    metrics_path: /metrics
    scrape_timeout: 10s
    static_configs:
      - targets: ["host.docker.internal:9102"]
        labels:
          environment: production

  - job_name: vanessa-mcp
    metrics_path: /metrics
    scrape_timeout: 10s
    static_configs:
      - targets:
          - "host.docker.internal:8101"
          - "host.docker.internal:8102"
          - "host.docker.internal:8103"
        labels:
          environment: production

  - job_name: vector
    metrics_path: /metrics
    scrape_timeout: 5s
    static_configs:
      - targets: ["vector:9598"]
        labels:
          environment: production
