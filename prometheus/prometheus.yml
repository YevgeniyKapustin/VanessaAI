# Prometheus scrape config for VanessaAI.
# Alerting rules live in rules.yml (rule_files), never inline here.
# Targets are Compose DNS names on the shared `backend` network
# (docker-compose.monitoring.yml in the same project). Apps do not
# publish bot/worker/MCP metrics ports to the host.
# If API/bot run on the host instead, use prometheus.host.yml.
# Kubernetes/Swarm should replace static_configs with service discovery.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules.yml

scrape_configs:
  - job_name: vanessa-api
    metrics_path: /metrics
    scrape_timeout: 10s
    static_configs:
      - targets: ["api:8000"]
        labels:
          environment: production

  - job_name: vanessa-bot
    metrics_path: /metrics
    scrape_timeout: 10s
    static_configs:
      - targets: ["bot:9101"]
        labels:
          environment: production

  - job_name: vanessa-worker
    metrics_path: /metrics
    scrape_timeout: 10s
    static_configs:
      - targets: ["worker:9102"]
        labels:
          environment: production

  - job_name: vanessa-mcp
    metrics_path: /metrics
    scrape_timeout: 10s
    static_configs:
      - targets:
          - "mcp-websearch:8101"
          - "mcp-knowledge:8102"
          - "mcp-vision:8103"
        labels:
          environment: production

  # nginx-exporter is only in docker-compose.prod.yml; scrape it there.

  - job_name: vector
    metrics_path: /metrics
    scrape_timeout: 5s
    static_configs:
      - targets: ["vector:9598"]
        labels:
          environment: production
