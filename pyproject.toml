[tool.poetry]
name = "vanessa"
version = "0.1.0"
description = "Telegram bot Vanessa with RAG and DeepSeek"
authors = ["Vanessa Team"]
packages = [
  { include = "vanessa" },
  { include = "services" },
]
requires-poetry = "==2.1.1"

[tool.poetry.dependencies]
python = "^3.12"
fastapi = ">=0.115.0"
uvicorn = { version = ">=0.32.0", extras = ["standard"] }
aiogram = ">=3.15.0"
sqlalchemy = { version = ">=2.0.36", extras = ["asyncio"] }
asyncpg = ">=0.30.0"
alembic = ">=1.14.0"
qdrant-client = ">=1.12.0"
# Async message broker for cross-service transport (Redis Streams).
redis = ">=5.0"
sentence-transformers = ">=3.3.0"
torch = { version = ">=2.4,<3", source = "pytorch-cpu" }
anthropic = ">=0.40.0"
openai = ">=1.0.0"
# Model Context Protocol — servers (FastMCP) + client (streamable HTTP / stdio).
# Pinned to 1.x: aiogram 3.x requires pydantic <2.12, while mcp 2.x requires
# pydantic >=2.12 — only mcp 1.x coexists with the bot in one environment.
mcp = ">=1.5.0,<2"
pydantic-settings = ">=2.6.0"
httpx = ">=0.28.0"
python-dotenv = ">=1.0.1"
pyyaml = ">=6.0.2"
pymorphy3 = "^2.0.6"
# Observability
prometheus-client = ">=0.21.0"
langfuse = ">=2.50.0"

[[tool.poetry.source]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
priority = "explicit"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.3.0"
pytest-asyncio = ">=0.24.0"
pytest-cov = "^7.1.0"
ruff = ">=0.8.0"
# In-memory Redis for broker tests (no server required).
fakeredis = ">=2.23"

[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.coverage.run]
source = ["vanessa", "services"]

[tool.coverage.report]
show_missing = true
precision = 0
fail_under = 90

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint.per-file-ignores]
"scripts/**" = ["E402"]
"alembic/env.py" = ["F401"]
